<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>Kalori Takip · Giriş</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main>
    <p class="eyebrow">Kalori Takip</p>
    <h1>Kendine iyi bakmanın küçük adımları.</h1>
    <p class="intro">Hesabına giriş yap veya yeni bir hesap oluşturarak takibine başla.</p>
    <section class="card">
      <h2 id="auth-title">Hesabına giriş yap</h2>
      <form id="auth-form">
        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9._\-]+" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <div class="password-field">
            <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required>
            <button id="password-visibility" class="password-visibility" type="button" aria-label="Şifreyi göster" aria-controls="password" aria-pressed="false" title="Şifreyi göster">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="m3 3 18 18"></path>
                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-3.1 3.9"></path>
                <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1.3 0 2.4-.3 3.4-.7"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
          <p class="hint">Şifren en az 12 karakter olmalı.</p>
        </div>
        <button id="auth-submit" type="submit">Giriş yap</button>
      </form>
      <button id="auth-toggle" class="auth-toggle" type="button">Yeni misin? Hesap oluştur</button>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <p class="motivation">Küçük ve sürdürülebilir adımlar zamanla büyük fark yaratır.</p>
    </section>
  </main>
  <script src="/site.js"></script>
  <script>
    const form = document.querySelector("#auth-form");
    const usernameInput = document.querySelector("#username");
    const passwordInput = document.querySelector("#password");
    const passwordVisibility = document.querySelector("#password-visibility");
    const openEye = passwordVisibility.querySelector(".eye-open");
    const closedEye = passwordVisibility.querySelector(".eye-closed");
    const authError = document.querySelector("#auth-error");
    const authTitle = document.querySelector("#auth-title");
    const authSubmit = document.querySelector("#auth-submit");
    const authToggle = document.querySelector("#auth-toggle");
    let isRegistering = false;

    function updatePasswordVisibility(visible) {
      passwordInput.setAttribute("type", visible ? "text" : "password");
      passwordVisibility.setAttribute("aria-pressed", String(visible));
      passwordVisibility.setAttribute("aria-label", visible ? "Şifreyi gizle" : "Şifreyi göster");
      passwordVisibility.title = visible ? "Şifreyi gizle" : "Şifreyi göster";
      openEye.toggleAttribute("hidden", visible);
      closedEye.toggleAttribute("hidden", !visible);
    }

    passwordVisibility.addEventListener("click", () => {
      updatePasswordVisibility(passwordInput.type === "password");
      passwordInput.focus({ preventScroll: true });
    });

    authToggle.addEventListener("click", () => {
      isRegistering = !isRegistering;
      authTitle.textContent = isRegistering ? "Yeni hesap oluştur" : "Hesabına giriş yap";
      authSubmit.textContent = isRegistering ? "Hesap oluştur" : "Giriş yap";
      authToggle.textContent = isRegistering ? "Zaten hesabın var mı? Giriş yap" : "Yeni misin? Hesap oluştur";
      passwordInput.autocomplete = isRegistering ? "new-password" : "current-password";
      authError.hidden = true;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      authError.hidden = true;
      authSubmit.disabled = true;
      authSubmit.textContent = isRegistering ? "Hesap oluşturuluyor…" : "Giriş yapılıyor…";
      try {
        const result = await KaloriApp.api(`/api/auth/${isRegistering ? "register" : "login"}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: usernameInput.value,
            password: passwordInput.value
          })
        });
        sessionStorage.setItem("kaloritakip:selected-date", KaloriApp.today());
        window.location.assign("/dashboard.html");
      } catch (error) {
        authError.textContent = error.message;
        authError.hidden = false;
      } finally {
        authSubmit.disabled = false;
        authSubmit.textContent = isRegistering ? "Hesap oluştur" : "Giriş yap";
      }
    });

    KaloriApp.api("/api/auth/me")
      .then(() => window.location.replace("/dashboard.html"))
      .catch(() => {});
  </script>
</body>
</html>
